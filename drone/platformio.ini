; Drone flight controller — M5Stack Stamp-S3 (ESP32-S3FN8)
;   env:bench   phase 0-4 bench/test firmware (src/bench/)
;   env:flight  madflight-based flight firmware (added in phase 5)
;
; Platform pinned to pioarduino 55.03.311 (Arduino-ESP32 3.3.x), the stable
; release current when madflight v2.4.2 was published.

[platformio]
default_envs = bench

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = m5stack-stamps3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D ARDUINO_USB_MODE=1        ; native USB Serial/JTAG
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; Serial = USB CDC

[env:bench]
build_src_filter = +<bench/>
